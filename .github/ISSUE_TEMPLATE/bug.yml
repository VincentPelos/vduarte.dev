name: Error
description: Algo que no funciona o se ve mal.
title: "Corregir …"
labels: ["tipo: fix"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Descripción del error.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: dropdown
    id: pantalla
    attributes:
      label: Tamaño de pantalla
      multiple: true
      options:
        - Móvil (390px)
        - Tablet (768px)
        - Escritorio (1280px)
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Arrastra imágenes aquí si ayudan.
